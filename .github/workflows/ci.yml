name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libfreetype-dev \
            pkg-config

      - name: Build (Debug)
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Build (ReleaseSmall)
        run: zig build -Doptimize=ReleaseSmall

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check src/

      - name: Build with warnings as errors
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libfreetype-dev pkg-config
          zig build -Doptimize=ReleaseFast 2>&1 | tee build.log
          if grep -qi "warning:" build.log; then
            echo "Build warnings detected"
            grep -i "warning:" build.log
          fi
