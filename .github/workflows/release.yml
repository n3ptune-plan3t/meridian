name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libfreetype-dev \
            pkg-config \
            gcc-aarch64-linux-gnu

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-gnu" ]; then
            zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu
          else
            zig build -Doptimize=ReleaseFast
          fi

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCH="${{ matrix.target }}"
          
          mkdir -p "meridian-${VERSION}-${ARCH}"
          cp zig-out/bin/meridian "meridian-${VERSION}-${ARCH}/"
          cp config/meridian.toml "meridian-${VERSION}-${ARCH}/"
          cp README.md "meridian-${VERSION}-${ARCH}/" 2>/dev/null || true
          cp LICENSE "meridian-${VERSION}-${ARCH}/" 2>/dev/null || true
          
          tar czf "meridian-${VERSION}-${ARCH}.tar.gz" "meridian-${VERSION}-${ARCH}/"
          echo "ASSET=meridian-${VERSION}-${ARCH}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
          draft: false
          prerelease: false
